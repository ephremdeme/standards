# Reusable workflow. Product repos call it with:
#   jobs: { ci: { uses: <org>/standards/.github/workflows/rust-ci.yml@<STANDARDS_SHA> } }
name: rust-ci
on: { workflow_call: {} }
# Security: least-privilege token; pin every third-party action to a full commit SHA
# (keep the version in a comment; let Dependabot/Renovate update them). Never use
# pull_request_target to run PR code. No production secrets in CI. No checkout keeps the
# repository token (persist-credentials: false): PR code runs after the checkout.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The application role of callers that separate it from the migration owner (game m2.2): a throwaway CI
      # credential like the service password above; unused by a caller without scripts/db/app-role.sh.
      APP_DATABASE_URL: postgres://game_app:game_app@localhost:5432/postgres
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head 2026-09-30 (no tags published); rust-toolchain.toml pins the compiler
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: "cargo-nextest,cargo-deny,cargo-audit,sqlx-cli" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Commit timestamps in the service cluster (exchange D-081, late-fill monitor over pg_xact_commit_timestamp; the
      # exchange's e2_detective tests assert the setting). A service container takes no command arguments, so the setting
      # is persisted with ALTER SYSTEM and the container restarted before the schema is migrated. Harmless for a repo that
      # does not read it. First seen red: exchange run 37219663988 (2026-10-04), whose own `chain` job already did this.
      - name: track commit timestamps in the service cluster (ALTER SYSTEM + restart)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -eu
          docker exec "$PG_CONTAINER" psql -U postgres -X -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_commit_timestamp = on"
          docker restart "$PG_CONTAINER"
          for i in $(seq 1 30); do docker exec "$PG_CONTAINER" pg_isready -U postgres && break; sleep 1; done
          docker exec "$PG_CONTAINER" psql -U postgres -X -A -t -v ON_ERROR_STOP=1 -c "SHOW track_commit_timestamp" | grep -qx on
      - run: cargo sqlx migrate run && cargo sqlx prepare --workspace --check
      - if: hashFiles('scripts/db/app-role.sh') != ''
        name: application database role (callers that ship scripts/db/app-role.sh)
        run: bash scripts/db/app-role.sh
      - run: cargo nextest run --workspace
      - run: cargo deny check
      - run: cargo audit
  # The frontend gate (retro review 8): the same steps as bin/check's frontend block, from a clean `npm ci`.
  # hashFiles() is not available in a job-level `if` (no checkout exists there yet), so each step after the checkout
  # carries the condition; a repository without web/package.json gets a green no-op job.
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - if: hashFiles('web/package.json') != ''
        run: npm ci --no-audit --no-fund
      - if: hashFiles('web/package.json') != ''
        run: npx --no-install tsc --noEmit
      - if: hashFiles('web/package.json') != ''
        run: npx --no-install biome ci .
      - if: hashFiles('web/package.json') != ''
        run: npx --no-install vitest run
      - if: hashFiles('web/package.json') != ''
        run: npm audit --audit-level=high
      - if: hashFiles('web/package.json') != ''
        run: npm run --silent budget
  # Secret scan with the pinned gitleaks CLI (retro review 10): no action licence, no secrets, so it also runs on
  # pull requests from forks. Pull requests: the PR's own commits (base..head); merge_group and push: the last 50.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: install gitleaks 8.30.1 (pinned release tarball, sha256-verified)
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: scan the change's commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then opts="$BASE..$HEAD"; else opts="-n 50"; fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$opts" .
