# Reusable workflow. Product repos call it with:
#   jobs: { ci: { uses: <org>/standards/.github/workflows/rust-ci.yml@main } }
name: rust-ci
on: { workflow_call: {} }
# Security: least-privilege token; pin every third-party action to a full commit SHA
# (keep the version in a comment; let Dependabot/Renovate update them). Never use
# pull_request_target to run PR code. No production secrets in CI.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head 2026-09-30 (no tags published); rust-toolchain.toml pins the compiler
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: "cargo-nextest,cargo-deny,cargo-audit,sqlx-cli" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo sqlx migrate run && cargo sqlx prepare --workspace --check
      - run: cargo nextest run --workspace
      - run: cargo deny check
      - run: cargo audit
  secrets:
    runs-on: ubuntu-latest
    # The action lists the pull request's commits through the API: it needs pull-requests: read, and the
    # calling workflow must grant the same (a called workflow can only narrow the caller's permissions).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by the action to scan a pull request's commits (the repo-scoped token, read-only here).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments: that would need pull-requests: write; the failing check is the signal.
          GITLEAKS_ENABLE_COMMENTS: "false"
