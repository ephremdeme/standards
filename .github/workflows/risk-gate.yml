# Reusable risk gate (retro review 6) — INFORMATIONAL (solo developer, founder decision 2026-10-02): GitHub forbids
# approving your own pull request, so no approval is counted; the job classifies the PR, lists the HIGH paths with
# their reasons in the log and the step summary, and is always green. The founder merges after reading that list.
# Product repos call it through templates/risk-gate.yml, pinning ONE standards commit SHA twice: in
# `uses: <org>/standards/.github/workflows/risk-gate.yml@<SHA>` and as `standards_ref: <SHA>`.
# The classifier and the gate run from that pinned, trusted standards commit, checked out on its own — never from the
# pull request's `standards` submodule, which the pull request itself could repoint at a classifier that prints LOW.
name: risk-gate
on:
  workflow_call:
    inputs:
      standards_ref:
        description: "full commit SHA of the standards repo; the same SHA as in the caller's uses: line"
        type: string
        required: true
permissions:
  contents: read
jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - name: standards_ref must be a full commit SHA (a branch or tag can move)
        env: { REF: "${{ inputs.standards_ref }}" }
        run: |
          case "$REF" in *[!0-9a-f]*|'') echo "risk-gate: standards_ref '$REF' is not a commit SHA"; exit 1;; esac
          [ "${#REF}" -eq 40 ] || { echo "risk-gate: standards_ref '$REF' is not a full 40-character SHA"; exit 1; }
      - name: trusted standards (pinned commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/standards
          ref: ${{ inputs.standards_ref }}
          path: standards-trusted
          persist-credentials: false
      - name: the calling repository (its standards submodule is never initialised)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: product
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: classify and list HIGH paths
        working-directory: product
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          trusted="$GITHUB_WORKSPACE/standards-trusted/bin"
          # classify-risk prints HIGH and exits 1 when the diff cannot be computed: that stays HIGH (fail closed).
          # Its stderr (one `high: <path> (<reason>)` line per HIGH path) is the list risk-gate prints.
          level=$(sh "$trusted/classify-risk" "$BASE" "$HEAD" 2>"$RUNNER_TEMP/reasons.txt") || level=HIGH
          # Informational by decision: risk-gate always exits 0; it never prints LOW unless the classifier did.
          sh "$trusted/risk-gate" "$level" "$HEAD" "$RUNNER_TEMP/reasons.txt"
